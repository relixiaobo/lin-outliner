# The e2e signal for `main`.
#
# Why this exists: for three rounds running, a red `main` was discovered only
# because some PR gate happened to run the full suite. Each round cost the gating
# PR the time to prove which failures were not its own, and each discovery was
# accidental.
#
# Two properties it has to have, and why:
#
#   1. It runs on `main` without a PR. Triggering on push means the signal arrives
#      right after the merge that caused it, so attribution is nearly free — better
#      than a nightly, which can leave a day of merges to bisect.
#   2. It takes FIVE samples, because one run cannot tell a red baseline from a
#      flake. Four full runs at the #475 gate produced a different failing set each
#      time; only one test failed in all four.
#
# The samples are five independent WHOLE-SUITE runs in parallel — not `--shard`,
# and not `--repeat-each`. The failures worth catching are order/state-dependent
# (they pass solo and fail in a full run), so anything that changes what runs
# alongside what would launder away the signal. Parallel samples cost one suite of
# wall-clock, and nobody is waiting on them anyway.
#
# This job does NOT gate anything, and it is green whenever it managed to classify.
# `main` is red today and will be for a while; a permanently failing badge is one
# people learn to ignore, which would put us back where we started. The verdict
# lives in the tracking issue, which the main agent reads at gate time — the moment
# it is actually useful.
name: e2e signal (main)

on:
  push:
    branches: [main]
  # A branch gets the SAME five samples on the SAME runner image, so subtracting
  # `main`'s numbers from its own is meaningful. It still gates nothing — it turns
  # "is this failure mine?" from a judgement call into a set difference.
  pull_request:
  # Backstop: environment drift is invisible in a quiet week with no merges.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  # Only the newest commit's verdict is worth having; cancel superseded runs.
  group: e2e-signal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write
  # `gh run download` needs this to fetch `main`'s baseline samples.
  actions: read

jobs:
  sample:
    name: sample ${{ matrix.sample }}
    # macOS, because the product is macOS-only and the suite encodes that: it
    # presses `Meta+A` and `Cmd+Enter`, where Linux binds a different modifier
    # entirely, and it asserts alignment and row heights that come out of the
    # platform font stack. The first run of this workflow was on ubuntu and
    # reported ten *deterministic* failures that pass on macOS — a signal
    # measuring a platform we do not ship, whose stable false red is exactly the
    # thing people learn to ignore. Running on Linux was never the question;
    # being right about macOS is.
    runs-on: macos-latest
    timeout-minutes: 45
    # A red sample is data, not a broken job: the matrix must complete so the
    # classifier sees all five.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # No `--with-deps`: that installs Linux system packages and has nothing to
      # do on a macOS runner.
      - run: bunx playwright install chromium
      - name: Run the full suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: report.json
        # `|| true` because the exit code is the thing being measured, not an error.
        run: bun run test:e2e -- --reporter=list,json || true
      - name: Name the report after its sample
        run: mv report.json "sample-${{ matrix.sample }}.json"
      - uses: actions/upload-artifact@v4
        with:
          # The platform is IN THE NAME so a baseline can never pool two of
          # them. The first pull request to use the baseline pooled a leftover
          # ubuntu run with a macOS one and reported a test as 5/10 — five red
          # on one OS, five green on the other — which is precisely the
          # cross-environment comparison this whole design refuses. Change the
          # runner and the old artifacts stop matching, so the baseline goes
          # empty and says so, instead of silently mixing.
          name: e2e-sample-macos-${{ matrix.sample }}
          path: sample-${{ matrix.sample }}.json
          if-no-files-found: error

  verdict:
    name: classify and publish
    # Linux here on purpose: this job only reads JSON and calls `gh`, so keeping
    # it off macOS leaves the whole macOS concurrency allowance for the samples.
    runs-on: ubuntu-latest
    needs: sample
    if: always() && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: samples
          pattern: e2e-sample-macos-*
          merge-multiple: true
      - name: Classify
        id: classify
        run: |
          {
            echo "_Commit \`${GITHUB_SHA:0:8}\` · [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
            echo
            bun scripts/e2e-classify.ts samples/*.json
          } > verdict.md
          cat verdict.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'e2e signal: the state of `main`'
        run: |
          set -euo pipefail
          # One long-lived issue, updated in place. A new issue per run would be
          # notification spam that trains everyone to mute the thing.
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")"
          if [ -z "$number" ]; then
            gh issue create --title "$TITLE" --body-file verdict.md
          else
            gh issue edit "$number" --body-file verdict.md
          fi

  compare:
    name: subtract main's baseline
    runs-on: ubuntu-latest
    needs: sample
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: branch
          pattern: e2e-sample-macos-*
          merge-multiple: true
      - name: Fetch main's baseline samples
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The last three successful runs ON main, not the newest one. Same runner
          # image — comparing across environments proves nothing — but ALSO enough
          # samples for the baseline to be a rate rather than a snapshot.
          #
          # The first version used one run, and the first pull request it ran on
          # showed why that is wrong: a test failing ~1/5 of the time is absent from
          # any single five-sample baseline about two thirds of the time, so it turns
          # up on the branch, is missing from the baseline, and gets reported as
          # "introduced by this branch". That is the very mistake this tool exists to
          # prevent, made one layer down — the comparison was guarding against a
          # single sample on the branch side while relying on one for the baseline.
          # Fifteen samples put a 1-in-5 test in the baseline ~96% of the time.
          ids="$(gh run list --workflow=e2e-main.yml --branch main --status success \
            --limit 3 --json databaseId --jq '.[].databaseId')"
          if [ -z "$ids" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Per-run directories: artifact names repeat across runs and would
          # otherwise overwrite each other, silently shrinking the baseline.
          #
          # A run with no matching artifacts is SKIPPED, not fatal. It means that
          # run predates the current artifact naming or used another runner, and
          # excluding it is the correct answer — that is the whole point of putting
          # the platform in the name. The first version let `gh run download`'s
          # exit code reach `set -e`, so the naming change failed the job instead of
          # reporting an unavailable baseline: the guard was right, the fallback it
          # promised was simply never written.
          found=0
          for id in $ids; do
            mkdir -p "baseline/run-$id"
            if gh run download "$id" --pattern 'e2e-sample-macos-*' --dir "baseline/run-$id"; then
              found=$((found + 1))
            else
              rmdir "baseline/run-$id" 2>/dev/null || true
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare
        run: |
          set -euo pipefail
          bun scripts/e2e-classify.ts --json branch/*.json > branch.json
          {
            echo "_Commit \`${GITHUB_SHA:0:8}\` · [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
            echo
            if [ "${{ steps.baseline.outputs.available }}" = "true" ]; then
              find baseline -name '*.json' -print0 | xargs -0 bun scripts/e2e-classify.ts --json > baseline.json
              bun scripts/e2e-compare.ts branch.json baseline.json
            else
              bun scripts/e2e-compare.ts branch.json
            fi
          } > comparison.md
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Updated in place: one comment per PR, not one per push.
          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- e2e-compare -->"))) | .[0].id // empty')"
          if [ -z "$id" ]; then
            gh pr comment "$PR" --body-file comparison.md
          else
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" \
              -F body=@comparison.md >/dev/null
          fi
